<!DOCTYPE html>
<html>
<head>
    <title>Staff</title>
</head>
<body>

<h2>Staff List</h2>

<a href="/staff/add">
    <button>Add Staff</button>
</a>

<br><br>

<table border="1">
    <tr>
        <th>Name</th>
        <th>ID Number</th>
        <th>Gender</th>
        <th>Role</th>
        <th>Phone</th>
        <th>Status</th>
        <th>Action</th>
    </tr>

    {% for s in staff %}
    <tr>
        <td>{{ s.name }}</td>
        <td>{{ s.id_number }}</td>
        <td>{{ s.gender }}</td>
        <td>{{ s.role }}</td>
        <td>{{ s.phone }}</td>
        <td>{{ s.status }}</td>
        <td>
            <a href="/edit/{{ loop.index0 }}">Edit</a> |
            <a href="/delete/{{ loop.index0 }}" onclick="return confirm('Delete this staff?')">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>

</body>
</html>

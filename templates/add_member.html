{% extends "base.html" %}

{% block content %}
<h2>Add New Member</h2>
<form method="POST" action="/add_member">

<!-- Personal Identification -->
<h3>Personal Identification</h3>
<label>First Name:</label><br>
<input type="text" name="first_name" required><br>
<label>Last Name:</label><br>
<input type="text" name="last_name" required><br>
<label>ID Number:</label><br>
<input type="text" name="id_number" required><br>
<label>Date of Birth:</label><br>
<input type="date" name="date_of_birth"><br>
<label>Gender:</label><br>
<select name="gender">
    <option value="Male">Male</option>
    <option value="Female">Female</option>
</select><br>
<label>Phone:</label><br>
<input type="text" name="phone"><br>
<label>Marital Status:</label><br>
<select name="marital_status">
    <option>Single</option>
    <option>Married</option>
    <option>Widow</option>
    <option>Widower</option>
    <option>Divorced</option>
</select><br>

<!-- Personal Location Details -->
<h3>Location Details</h3>
<label>Country:</label><br>
<input type="text" name="country" value="Rwanda" readonly><br>
<label>Province:</label><br>
<input type="text" name="province" value="Kigali" readonly><br>
<label>District:</label><br>
<input type="text" name="district"><br>
<label>Sector:</label><br>
<input type="text" name="sector"><br>
<label>Cell:</label><br>
<input type="text" name="cell"><br>
<label>Village:</label><br>
<input type="text" name="village"><br>

<!-- Church Responsibilities -->
<h3>Church Responsibilities</h3>
<label>Role:</label><br>
<select name="role">
    <option>Christian</option>
    <option>Choir member</option>
    <option>COGEE member</option>
    <option>Choir committee member</option>
</select><br>

<label>Baptized:</label><br>
<select name="baptized" id="baptized" onchange="showBaptismDate()">
    <option value="No">No</option>
    <option value="Yes">Yes</option>
</select><br>

<div id="baptismDateDiv" style="display:none;">
    <label>Baptism Date:</label><br>
    <input type="date" name="baptism_date"><br>
</div>

<label>Itsinda:</label><br>
<select name="itsinda">
    <option>Abanaziri</option>
    <option>Abanarada</option>
    <option>Abisiraheli</option>
    <option>Abayosefu</option>
    <option>Modal village</option>
    <option>Abaleweli</option>
    <option>Ababenyamini</option>
    <option>Abaheburayo</option>
    <option>Abagediyoni</option>
</select><br>

<label>Status:</label><br>
<select name="status" id="status" onchange="showInactiveReason()">
    <option value="Active">Active</option>
    <option value="Inactive">Inactive</option>
</select><br>

<div id="inactiveReasonDiv" style="display:none;">
    <label>Inactive Reason:</label><br>
    <select name="inactive_reason">
        <option>Died</option>
        <option>Changed location</option>
        <option>Changed church</option>
        <option>Last 1 year without participation</option>
        <option>Abusing internal regulations</option>
    </select><br>
</div>

<br>
<button type="submit">Add Member</button>
</form>

<script>
function showBaptismDate() {
    const baptized = document.getElementById("baptized").value;
    document.getElementById("baptismDateDiv").style.display = baptized === "Yes" ? "block" : "none";
}

function showInactiveReason() {
    const status = document.getElementById("status").value;
    document.getElementById("inactiveReasonDiv").style.display = status === "Inactive" ? "block" : "none";
}
</script>
{% endblock %}

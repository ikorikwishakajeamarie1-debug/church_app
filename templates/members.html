<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Church Members</title>

    <style>
        body {
            font-family: Arial;
            margin: 20px;
        }

        h2 {
            text-align: center;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .section {
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        .section h3 {
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
        }

        input, select {
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .btn {
            background-color: green;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn:hover {
            background-color: darkgreen;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Church Members Management</h2>

    <form method="POST" action="{{ url_for('add_member') }}">

        <!-- ================= PERSONAL IDENTIFICATION ================= -->
        <div class="section">
            <h3>Personal Identification</h3>

            <div class="form-group">
                <label>Names</label>
                <input type="text" name="full_name" required>
            </div>

            <div class="form-group">
                <label>ID Number</label>
                <input type="text" name="national_id">
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" name="phone">
            </div>

            <div class="form-group">
                <label>Gender</label>
                <select name="gender">
                    <option>Male</option>
                    <option>Female</option>
                </select>
            </div>

            <div class="form-group">
                <label>Marital Status</label>
                <select name="marital_status" id="marital_status" onchange="toggleParentName()">
                    <option>Single</option>
                    <option>Married</option>
                </select>
            </div>

            <div class="form-group" id="parent_name_field" style="display:none;">
                <label>Parent Name (for single)</label>
                <input type="text" name="parent_name">
            </div>

            <div class="form-group">
                <label>Birthdate</label>
                <input type="date" name="dob">
            </div>
        </div>

        <!-- ================= LOCATION DETAILS ================= -->
        <div class="section">
            <h3>Location Details</h3>

            <div class="form-group">
                <label>Country</label>
                <input type="text" name="country" value="Rwanda" readonly>
            </div>

            <div class="form-group">
                <label>Province</label>
                <input type="text" name="province" value="Kigali" readonly>
            </div>

            <div class="form-group">
                <label>District</label>
                <select name="district">
                    <option>Kicukiro</option>
                    <option>Nyarugenge</option>
                    <option>Gasabo</option>
                </select>
            </div>

            <div class="form-group">
                <label>Sector</label>
                <input type="text" name="sector">
            </div>

            <div class="form-group">
                <label>Cell</label>
                <input type="text" name="cell">
            </div>

            <div class="form-group">
                <label>Village</label>
                <input type="text" name="village">
            </div>
        </div>

        <!-- ================= CHURCH RESPONSIBILITIES ================= -->
        <div class="section">
            <h3>Church Responsibilities</h3>

            <div class="form-group">
                <label>Role</label>
                <select name="role">
                    <option>Christian</option>
                    <option>Choir Member</option>
                    <option>Choir Committee Member</option>
                    <option>COGEE MEMBER</option>
                </select>
            </div>

            <div class="form-group">
                <label>Baptized</label>
                <select name="baptized">
                    <option>Yes</option>
                    <option>No</option>
                </select>
            </div>

            <div class="form-group">
                <label>Date of Baptism</label>
                <input type="date" name="baptism_date">
            </div>

            <div class="form-group">
                <label>Itsinda</label>
                <select name="itsinda">
                    <option>Abanaziri</option>
                    <option>Abanarada</option>
                    <option>Abisiraheli</option>
                    <option>Abayosefu</option>
                    <option>Modal village</option>
                    <option>Abaleweli</option>
                    <option>Ababenyamini</option>
                    <option>Abaheburayo</option>
                    <option>Abagidiyoni</option>
                </select>
            </div>

            <div class="form-group">
                <label>Status</label>
                <select name="status" id="status" onchange="toggleReason()">
                    <option>Active</option>
                    <option>Deactive</option>
                </select>
            </div>

            <div class="form-group" id="reason_field" style="display:none;">
                <label>Reason for Deactivation</label>
                <select name="deactivation_reason">
                    <option>Change the church</option>
                    <option>Change the location</option>
                    <option>Last 1 year without participating</option>
                    <option>Abusing internal regulations</option>
                </select>
            </div>

        </div>

        <button type="submit" class="btn">Add Member</button>

    </form>

</div>

<!-- ================= SCRIPT ================= -->
<script>
function toggleParentName() {
    let maritalStatus = document.getElementById("marital_status").value;
    let parentField = document.getElementById("parent_name_field");

    if (maritalStatus === "Single") {
        parentField.style.display = "block";
    } else {
        parentField.style.display = "none";
    }
}

function toggleReason() {
    let status = document.getElementById("status").value;
    let reasonField = document.getElementById("reason_field");

    if (status === "Deactive") {
        reasonField.style.display = "block";
    } else {
        reasonField.style.display = "none";
    }
}
</script>

</body>
</html>

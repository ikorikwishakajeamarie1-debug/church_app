{% extends "base.html" %}

{% block content %}

<h2>Staff</h2>

<a href="/staff/add"><button>Add Staff</button></a>

<table border="1">
    <tr>
        <th>Name</th>
        <th>ID</th>
        <th>Gender</th>
        <th>Role</th>
        <th>Phone</th>
        <th>Status</th>
        <th>Action</th>
    </tr>

    {% for s in staff %}
    <tr>
        <td>{{ s[1] }}</td>
        <td>{{ s[2] }}</td>
        <td>{{ s[3] }}</td>
        <td>{{ s[4] }}</td>
        <td>{{ s[5] }}</td>
        <td>{{ s[6] }}</td>
        <td>
            <a href="/edit_staff/{{ s[0] }}">Edit</a> |
            <a href="/delete_staff/{{ s[0] }}">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>

{% endblock %}

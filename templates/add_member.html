<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add New Member</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        label { display: block; margin-top: 10px; }
        input, select { width: 300px; padding: 5px; }
        .optional { font-size: 0.9em; color: gray; }
        button { margin-top: 20px; padding: 10px 20px; }
    </style>
    <script>
        function toggleBaptismDate() {
            const baptized = document.getElementById('baptized').value;
            document.getElementById('baptism_date_container').style.display = baptized === 'Yes' ? 'block' : 'none';
        }
        function toggleInactiveReason() {
            const status = document.getElementById('status').value;
            document.getElementById('inactive_reason_container').style.display = status === 'Inactive' ? 'block' : 'none';
        }
    </script>
</head>
<body>
    <h2>Add New Member</h2>
    <form method="POST">
        <!-- Personal Identification -->
        <label>First Name: <input type="text" name="first_name" required></label>
        <label>Last Name: <input type="text" name="last_name" required></label>
        <label>ID Number: <input type="text" name="id_number" required></label>
        <label>Birthdate: <input type="date" name="date_of_birth" required></label>
        <label>Gender:
            <select name="gender" required>
                <option value="">--Select--</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>
        </label>
        <label>Phone Number: <input type="text" name="phone" required></label>
        <label>Marital Status:
            <select name="marital_status" required>
                <option value="">--Select--</option>
                <option value="Single">Single</option>
                <option value="Married">Married</option>
                <option value="Widow">Widow</option>
                <option value="Widower">Widower</option>
                <option value="Divorced">Divorced</option>
            </select>
        </label>

        <!-- Location -->
        <label>Country: <input type="text" name="country" value="Rwanda" required></label>
        <label>Province: <input type="text" name="province" value="Kigali" required></label>
        <label>District: <input type="text" name="district" required></label>
        <label>Sector: <input type="text" name="sector" required></label>
        <label>Cell: <input type="text" name="cell" required></label>
        <label>Village: <input type="text" name="village" required></label>

        <!-- Church Responsibilities -->
        <label>Role:
            <select name="role" required>
                <option value="">--Select--</option>
                <option value="Christian">Christian</option>
                <option value="Choir Member">Choir Member</option>
                <option value="COGEE Member">COGEE Member</option>
                <option value="Choir Committee Member">Choir Committee Member</option>
            </select>
        </label>
        <label>Baptized:
            <select name="baptized" id="baptized" onchange="toggleBaptismDate()" required>
                <option value="">--Select--</option>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select>
        </label>
        <div id="baptism_date_container" style="display:none;">
            <label>Baptism Date: <input type="date" name="baptism_date"></label>
        </div>
        <label>Itsinda:
            <select name="itsinda" required>
                <option value="">--Select--</option>
                <option value="Abanaziri">Abanaziri</option>
                <option value="Abanarada">Abanarada</option>
                <option value="Abisiraheli">Abisiraheli</option>
                <option value="Abayosefu">Abayosefu</option>
                <option value="Modal Village">Modal Village</option>
                <option value="Abaleweli">Abaleweli</option>
                <option value="Ababenyamini">Ababenyamini</option>
                <option value="Abaheburayo">Abaheburayo</option>
                <option value="Abagediyoni">Abagediyoni</option>
            </select>
        </label>
        <label>Status:
            <select name="status" id="status" onchange="toggleInactiveReason()" required>
                <option value="">--Select--</option>
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
            </select>
        </label>
        <div id="inactive_reason_container" style="display:none;">
            <label>Inactive Reason: <input type="text" name="inactive_reason" placeholder="Reason for inactivity"></label>
        </div>

        <button type="submit">Save Member</button>
    </form>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Church Members</title>

<style>
body { font-family: Arial; margin: 20px; }

.btn {
    padding: 8px 12px;
    background: green;
    color: white;
    border: none;
    cursor: pointer;
    border-radius: 5px;
}

.form-container {
    display: none;
    margin-top: 20px;
    padding: 15px;
    border: 1px solid #ccc;
}

input, select {
    width: 100%;
    padding: 6px;
    margin-bottom: 10px;
}

table {
    width: 100%;
    margin-top: 30px;
    border-collapse: collapse;
}

th, td {
    border: 1px solid black;
    padding: 8px;
    text-align: center;
}
</style>
</head>

<body>

<h2>Church Members</h2>

<button class="btn" onclick="toggleForm()">+ Add Member</button>

<!-- ================= FORM ================= -->
<div class="form-container" id="memberForm">

<form method="POST" action="/add_member">

<h3>1. Personal Identification</h3>

<label>ID</label>
<input type="number" name="member_id">

<label>Names</label>
<input type="text" name="names">

<label>ID Number</label>
<input type="text" name="id_number">

<label>Phone</label>
<input type="text" name="phone">

<label>Birthdate</label>
<input type="date" name="birthdate">

<label>Gender</label>
<select name="gender">
    <option>Male</option>
    <option>Female</option>
</select>

<label>Marital Status</label>
<select name="marital_status" onchange="toggleParentField(this)">
    <option>Married</option>
    <option>Widow</option>
    <option>Widower</option>
    <option>Divorced</option>
    <option value="Single">Single</option>
</select>

<div id="parentField" style="display:none;">
    <label>Parent Names</label>
    <input type="text" name="parent_names">
</div>

<h3>2. Location</h3>

<label>Country</label>
<input type="text" name="country" value="Rwanda">

<label>Province</label>
<input type="text" name="province" value="Kigali">

<label>District</label>
<select name="district">
    <option>Kicukiro</option>
    <option>Nyarugenge</option>
    <option>Gasabo</option>
</select>

<label>Sector</label>
<input type="text" name="sector">

<label>Cell</label>
<input type="text" name="cell">

<label>Village</label>
<input type="text" name="village">

<h3>3. Church Responsibilities</h3>

<label>Role</label>
<select name="role">
    <option>Christian</option>
    <option>Choir Member</option>
    <option>Choir Committee</option>
    <option>COGEE Member</option>
</select>

<label>Baptized</label>
<select name="baptized">
    <option>Yes</option>
    <option>No</option>
</select>

<label>Date of Baptism</label>
<input type="date" name="baptism_date">

<label>Itsinda</label>
<select name="itsinda">
    <option>Abanaziri</option>
    <option>Abanarada</option>
    <option>Abisiraheli</option>
    <option>Abayosefu</option>
    <option>Abaleweli</option>
    <option>Ababenyamini</option>
    <option>Abaheburayo</option>
    <option>Abagidiyoni</option>
</select>

<label>Status</label>
<select name="status" onchange="toggleReason(this)">
    <option>Active</option>
    <option value="Deactive">Deactive</option>
</select>

<div id="reasonField" style="display:none;">
    <label>Reason</label>
    <select name="reason">
        <option>Changed Location</option>
        <option>Changed Church</option>
        <option>Abusing Church Rules</option>
        <option>1 Year No Participation</option>
    </select>
</div>

<button type="submit" class="btn">Save</button>

</form>
</div>

<!-- ================= TABLE ================= -->
<table>
<tr>
    <th>ID</th>
    <th>Names</th>
    <th>ID Number</th>
    <th>Gender</th>
    <th>Phone</th>
    <th>Status</th>
    <th>Action</th>
</tr>

{% for m in members %}
<tr>
    <td>{{ m.member_id }}</td>
    <td>{{ m.names }}</td>
    <td>{{ m.id_number }}</td>
    <td>{{ m.gender }}</td>
    <td>{{ m.phone }}</td>
    <td>{{ m.status }}</td>
    <td>
        <a href="/view_member/{{ m.id }}">View</a> |
        <a href="/edit_member/{{ m.id }}">Edit</a> |
        <a href="/delete_member/{{ m.id }}">Delete</a>
    </td>
</tr>
{% endfor %}

</table>

<!-- ================= JS ================= -->
<script>
function toggleForm() {
    let form = document.getElementById("memberForm");
    form.style.display = (form.style.display === "block") ? "none" : "block";
}

function toggleParentField(select) {
    document.getElementById("parentField").style.display =
        (select.value === "Single") ? "block" : "none";
}

function toggleReason(select) {
    document.getElementById("reasonField").style.display =
        (select.value === "Deactive") ? "block" : "none";
}
</script>

</body>
</html>

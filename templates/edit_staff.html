<!DOCTYPE html>
<html>
<head>
    <title>Edit Staff</title>
</head>
<body>

<h2>Edit Staff</h2>

<form action="/update/{{ index }}" method="POST">

    Name:<br>
    <input type="text" name="name" value="{{ staff.name }}" required><br><br>

    ID Number:<br>
    <input type="text" name="id_number" value="{{ staff.id_number }}" required><br><br>

    Gender:<br>
    <select name="gender">
        <option {% if staff.gender == 'Male' %}selected{% endif %}>Male</option>
        <option {% if staff.gender == 'Female' %}selected{% endif %}>Female</option>
    </select><br><br>

    Role:<br>
    <input type="text" name="role" value="{{ staff.role }}"><br><br>

    Phone:<br>
    <input type="text" name="phone" value="{{ staff.phone }}"><br><br>

    Status:<br>
    <input type="text" name="status" value="{{ staff.status }}"><br><br>

    <button type="submit">Update</button>

</form>

</body>
</html>

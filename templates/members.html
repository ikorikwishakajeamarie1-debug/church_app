<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Church Data Management System</title>

    <style>
        body {
            font-family: Arial;
            margin: 20px;
        }

        h2 {
            text-align: center;
        }

        .btn {
            padding: 10px 15px;
            background-color: green;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        .btn:hover {
            background-color: darkgreen;
        }

        .form-container {
            display: none; /* 🔴 hidden by default */
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin: 5px 0 10px;
        }

        table {
            width: 100%;
            margin-top: 30px;
            border-collapse: collapse;
        }

        table, th, td {
            border: 1px solid black;
        }

        th, td {
            padding: 10px;
            text-align: center;
        }
    </style>
</head>

<body>

<h2>Church Members</h2>

<!-- ✅ Add Member Button -->
<button class="btn" onclick="toggleForm()">+ Add Member</button>

<!-- ✅ Hidden Form -->
<div class="form-container" id="memberForm">

    <form method="POST" action="/add_member">

        <label>First Name</label>
        <input type="text" name="first_name" required>

        <label>Last Name</label>
        <input type="text" name="last_name" required>

        <label>Gender</label>
        <select name="gender">
            <option>Male</option>
            <option>Female</option>
        </select>

        <label>Date of Birth</label>
        <input type="date" name="dob">

        <label>Phone</label>
        <input type="text" name="phone">

        <label>Address</label>
        <input type="text" name="address">

        <label>Baptized</label>
        <select name="baptized">
            <option>Yes</option>
            <option>No</option>
        </select>

        <button type="submit" class="btn">Save Member</button>
    </form>

</div>

<!-- ✅ Members Table -->
<table>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Gender</th>
        <th>Phone</th>
        <th>Baptized</th>
    </tr>

    {% for member in members %}
    <tr>
        <td>{{ member.id }}</td>
        <td>{{ member.first_name }} {{ member.last_name }}</td>
        <td>{{ member.gender }}</td>
        <td>{{ member.phone }}</td>
        <td>{{ member.baptized }}</td>
    </tr>
    {% endfor %}

</table>

<!-- ✅ JavaScript -->
<script>
    function toggleForm() {
        var form = document.getElementById("memberForm");

        if (form.style.display === "none" || form.style.display === "") {
            form.style.display = "block";
        } else {
            form.style.display = "none";
        }
    }
</script>

</body>
</html>

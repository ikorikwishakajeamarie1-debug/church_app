<!DOCTYPE html>
<html>
<head>
    <title>Staff</title>

    <style>
        body { font-family: Arial; margin: 0; background: #f4f6f9; }

        .title {
            background: #1f2d3d;
            color: white;
            text-align: center;
            padding: 15px;
        }

        .menu {
            background: #2c3e50;
            text-align: center;
            padding: 10px;
        }

        .menu a {
            color: white;
            margin: 10px;
            text-decoration: none;
        }

        .container { padding: 20px; }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ddd;
        }

        th {
            background: #34495e;
            color: white;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
        }

        .form-section { display: none; }

        .btn {
            padding: 8px;
            color: white;
            border: none;
            cursor: pointer;
        }

        .add { background: green; }
    </style>

    <script>
        function showForm() {
            document.getElementById("form").style.display = "block";
            document.getElementById("table").style.display = "none";
        }

        function showTable() {
            document.getElementById("form").style.display = "none";
            document.getElementById("table").style.display = "block";
        }
    </script>
</head>

<body>

<div class="title">Church Data Management System</div>

<div class="menu">
    <a href="/">Dashboard</a>
    <a href="/members">Church Members</a>
    <a href="/staff">Staff</a>
</div>

<div class="container">

    <!-- TABLE -->
    <div id="table">
        <button class="btn add" onclick="showForm()">+ Add Staff</button>

        <table border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>Names</th>
            <th>ID Number</th>
            <th>Gender</th>
            <th>Phone</th>
            <th>Role</th>
            <th>Status</th>
            <th>Action</th> <!-- ✅ NEW COLUMN -->
        </tr>
    </thead>

    <tbody>
        {% for s in staff %}
        <tr>
            <td>{{ s.id }}</td>
            <td>{{ s.names }}</td>
            <td>{{ s.id_number }}</td>
            <td>{{ s.gender }}</td>
            <td>{{ s.phone }}</td>
            <td>{{ s.role }}</td>
            <td>{{ s.status }}</td>

            <td>
                <!-- View/Edit/Delete buttons -->
                <a href="/edit_staff/{{ s.id }}">Edit</a> |
                <a href="/delete_staff/{{ s.id }}" onclick="return confirm('Delete this staff?')">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
    <!-- FORM -->
    <div id="form" class="form-section">

        <h2>Add Staff</h2>

        <form method="POST" action="/add_staff">

            <input type="text" name="names" placeholder="Names" required>
            <input type="text" name="id_number" placeholder="ID Number">

            <select name="gender">
                <option>Male</option>
                <option>Female</option>
            </select>

            <input type="text" name="phone" placeholder="Phone">

            <select name="status">
                <option>Existing</option>
                <option>New</option>
                <option>Deactive</option>
            </select>

            <select name="role">
                <option>Pastor</option>
                <option>Group Leader</option>
                <option>President of Choir</option>
                <option>President of COGEE</option>
            </select>

            <button type="submit" class="btn add">Save</button>
        </form>

        <br>
        <button onclick="showTable()">⬅ Back</button>

    </div>

</div>

</body>
</html>
